<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社労士AI講師 - 専属トレーニング</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- ヘッダー -->
    <header class="bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="font-black text-lg">📝 労基法 AI特訓</h1>
        <div class="text-sm font-bold bg-indigo-800 px-3 py-1 rounded-full">
            ⏱️ 累計学習: <span id="header-total-time">0</span>分
        </div>
    </header>

    <div class="max-w-3xl mx-auto p-4" id="app-container">
        <!-- 読み込み中画面 -->
        <div id="loading-screen" class="text-center py-20 fade-in">
            <div class="animate-spin h-10 w-10 border-4 border-indigo-500 border-t-transparent rounded-full mx-auto mb-4"></div>
            <p class="font-bold text-slate-500">スプレッドシートから学習記録を読み込み中...</p>
        </div>

        <!-- スタート画面 -->
        <div id="start-screen" class="hidden fade-in space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border-2 border-slate-100">
                <h2 class="text-xl font-black text-indigo-900 mb-4">👩‍🏫 センセイからの分析レポート</h2>
                <p id="ai-weakness-report" class="text-slate-700 font-bold leading-relaxed">（AIが直近のデータを分析中...）</p>
            </div>
            
            <button onclick="startTraining('normal')" class="w-full bg-gradient-to-r from-indigo-500 to-blue-500 text-white font-black py-5 rounded-2xl shadow-md active:scale-95 transition-transform text-xl flex justify-center items-center gap-2">
                <span>🔥 通常特訓スタート (10問)</span>
            </button>

            <button onclick="startTraining('ebbinghaus')" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-black py-5 rounded-2xl shadow-md active:scale-95 transition-transform text-xl flex justify-center items-center gap-2">
                <span>🧠 忘却曲線・弱点復習モード</span>
            </button>
        </div>

        <!-- 問題画面 -->
        <div id="question-screen" class="hidden fade-in">
            <div class="flex justify-between items-center mb-4">
                <span class="bg-slate-200 text-slate-600 font-bold px-3 py-1 rounded-lg text-sm" id="q-counter">Q 1/10</span>
                <span class="text-xs font-bold text-slate-400" id="q-id-display">ID: ---</span>
            </div>

            <!-- 学習記録ステータス -->
            <div class="bg-indigo-50 flex justify-between p-3 rounded-xl mb-4 text-sm font-bold border border-indigo-100">
                <div class="text-indigo-800">挑戦: <span id="stat-play">0</span>回</div>
                <div class="text-emerald-700">正解率: <span id="stat-rate">0</span>%</div>
                <div class="text-slate-600">直近: <span id="stat-history" class="tracking-widest">-</span></div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border-2 border-slate-100 text-lg font-bold leading-relaxed" id="q-text">
                <!-- 問題文 -->
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="checkAnswer('〇')" class="bg-red-50 text-red-600 border-2 border-red-200 font-black py-6 rounded-2xl active:bg-red-100 transition-colors text-2xl">〇</button>
                <button onclick="checkAnswer('✖')" class="bg-blue-50 text-blue-600 border-2 border-blue-200 font-black py-6 rounded-2xl active:bg-blue-100 transition-colors text-2xl">✖</button>
            </div>

            <!-- 解説・AIコメントエリア -->
            <div id="explanation-area" class="hidden fade-in bg-slate-50 p-5 rounded-2xl border-2 border-slate-200 mb-6">
                <div class="flex items-center gap-3 mb-3">
                    <span id="judge-mark" class="text-2xl font-black"></span>
                    <span class="font-bold text-slate-700">解説</span>
                </div>
                <p id="exp-text" class="text-slate-600 text-sm mb-4"></p>
                
                <div class="bg-white p-4 rounded-xl border border-slate-200">
                    <p class="text-xs text-slate-400 font-bold mb-1">👩‍🏫 AI講師のコメント</p>
                    <p id="ai-comment" class="font-bold text-slate-700">考え中...</p>
                </div>

                <!-- 派生ミニクイズエリア -->
                <div id="mini-quiz-area" class="hidden mt-4 bg-yellow-50 p-4 rounded-xl border border-yellow-200">
                    <p class="text-xs text-yellow-700 font-black mb-1">⚡ 抜き打ち派生クイズ！</p>
                    <p id="mini-quiz-text" class="font-bold text-slate-700 text-sm mb-3">生成中...</p>
                    <button onclick="closeMiniQuiz()" class="w-full bg-yellow-400 text-yellow-900 font-bold py-2 rounded-lg text-sm">確認した（次へ進む）</button>
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="mt-5 w-full bg-slate-800 text-white font-black py-4 rounded-xl active:scale-95 transition-transform">
                    次の問題へ ➔
                </button>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden fade-in text-center space-y-6 py-10">
            <h2 class="text-3xl font-black text-indigo-900">特訓完了！</h2>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-2 border-slate-100 text-left">
                <p class="text-xs text-slate-400 font-bold mb-2">👩‍🏫 センセイからの総括</p>
                <p id="ai-result-comment" class="font-bold text-slate-700 leading-relaxed">（成績を集計中...）</p>
            </div>
            <button onclick="location.reload()" class="w-full bg-slate-200 text-slate-700 font-black py-4 rounded-xl active:scale-95 transition-transform">
                ホームに戻る
            </button>
        </div>
    </div>

    <!-- 非表示の音声プレイヤー -->
    <audio id="tts-player" class="hidden"></audio>

    <script>
        // ==========================================
        // ⚙️ 基本設定・連携URL
        // ==========================================
        const GAS_URL = "https://script.google.com/a/macros/sr-nakao.com/s/AKfycbyHu72D7p9XrmynRKYbt_4HOfhJ47D3xEdv-SgqTWS1iSrxWo6KuhZnzTbMvitQ7r0_Eg/exec";
        
        // ※AI StudioのAPIキーは localStorage("gemini_api_key") から取得
        let apiKey = localStorage.getItem("gemini_api_key");

        // ==========================================
        // 📚 問題データ（※ご自身の問題集に差し替えてください）
        // ==========================================
        const allQuestions = [
            { id: "rouki_001", text: "労働基準法において、労働条件は労働者が人たるに値する生活を営むための必要を充たすべきものでなければならないとされている。", answer: "〇", explanation: "労基法第1条（労働条件の原則）の規定通りです。" },
            { id: "rouki_002", text: "使用者は、暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段によって、労働者の意思に反して労働を強制してはならない。", answer: "〇", explanation: "労基法第5条（強制労働の禁止）の規定です。" },
            { id: "rouki_003", text: "労働基準法でいう「労働者」とは、職業の種類を問わず、事業又は事務所に使用される者で、賃金を支払われる者をいう。", answer: "〇", explanation: "労基法第9条の規定通りです。" },
            // テスト用に少し追加
            { id: "rouki_004", text: "原則として、満15歳に達した日以後の最初の3月31日が終了するまでの児童を労働者として使用してはならない。", answer: "〇", explanation: "労基法第56条（最低年齢）の規定です。" },
            { id: "rouki_005", text: "使用者は、労働者名簿、賃金台帳及び雇入等に関する重要な書類を、3年間保存しなければならない。", answer: "✖", explanation: "令和2年法改正により、原則は「5年間」です（当分の間は3年）。" }
        ];

        // ==========================================
        // 🧠 システム変数
        // ==========================================
        let dbHistory = {}; 
        let totalStudyTimeSec = 0;
        let sessionStartTime = Date.now();
        let currentPlaylist = [];
        let currentIndex = 0;
        let currentCorrectCount = 0;

        // ペルソナ設定
        const personaPrompt = `あなたは18歳の天才女性社労士講師です。性格はノリの良いJK風で、少しS気質ですが、根は生徒思いです。長ったらしい説明は嫌いで、テンポ良く短く話します。`;

        // ==========================================
        // 🚀 起動処理
        // ==========================================
        window.onload = async () => {
            if(!apiKey) {
                apiKey = prompt("Gemini APIキーを入力してください:");
                localStorage.setItem("gemini_api_key", apiKey);
            }
            await fetchGASData();
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            generateWeaknessReport();
        };

        // ==========================================
        // 📡 GAS（スプレッドシート）通信系
        // ==========================================
        async function fetchGASData() {
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_all' })
                });
                const data = await res.json();
                if(data.success) {
                    dbHistory = data.history;
                    totalStudyTimeSec = data.totalTime || 0;
                    updateHeaderTime();
                }
            } catch(e) {
                console.error("GAS通信エラー:", e);
                // エラーでも止まらないようにする
            }
        }

        async function saveAnswerToGAS(q_id, is_correct) {
            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'save_answer', q_id: q_id, is_correct: is_correct })
                });
                const data = await res.json();
                if(data.success) {
                    dbHistory[q_id] = { playCount: data.playCount, correctCount: data.correctCount, histStr: data.histStr };
                }
            } catch(e) { console.error(e); }
        }

        async function saveTimeToGAS() {
            const sessionTime = Math.floor((Date.now() - sessionStartTime) / 1000);
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'save_time', time_sec: sessionTime })
                });
            } catch(e) { console.error(e); }
        }

        // ==========================================
        // 🤖 Gemini API 通信系（音声＆テキスト）
        // ==========================================
        async function speakWithGemini(text) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `若い女性の声で、少し生意気でノリ良く話してください。「${text}」` }] }]
                    })
                });
                const data = await res.json();
                const audioBase64 = data.candidates[0].content.parts[0].inlineData.data;
                const player = document.getElementById('tts-player');
                player.src = `data:audio/mp3;base64,${audioBase64}`;
                player.play();
            } catch (e) {
                console.error("TTSエラー:", e);
                // 失敗時はブラウザの音声で代用
                const ut = new SpeechSynthesisUtterance(text);
                ut.pitch = 1.4; ut.rate = 1.1;
                speechSynthesis.speak(ut);
            }
        }

        async function fetchGeminiText(promptText, usePro = false) {
            const model = usePro ? "gemini-3.1-pro-preview" : "gemini-2.5-flash";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: personaPrompt + "\n\n" + promptText }] }]
                    })
                });
                const data = await res.json();
                return data.candidates[0].content.parts[0].text;
            } catch(e) {
                return "ごめん、通信エラーみたい。次いこっか！";
            }
        }

        // ==========================================
        // 🎮 アプリロジック
        // ==========================================
        function updateHeaderTime() {
            document.getElementById('header-total-time').innerText = Math.floor(totalStudyTimeSec / 60);
        }

        async function generateWeaknessReport() {
            // スプレッドシートのデータを元に弱点分析プロンプトを作成
            let prompt = `以下の学習記録から、直近間違えた要素を指摘し、本日の特訓へ向けた一言アドバイスを生成してください。2文以内で簡潔に。`;
            const report = await fetchGeminiText(prompt, false);
            document.getElementById('ai-weakness-report').innerText = report;
            speakWithGemini(report);
        }

        function startTraining(mode) {
            document.getElementById('start-screen').classList.add('hidden');
            
            // シャッフル用コピー
            let pool = [...allQuestions].sort(() => Math.random() - 0.5);

            if(mode === 'ebbinghaus') {
                // 忘却曲線モード：正解率が低いもの、未解答のものを最優先
                pool.sort((a, b) => {
                    const statA = dbHistory[a.id] || { playCount: 0, correctCount: 0 };
                    const statB = dbHistory[b.id] || { playCount: 0, correctCount: 0 };
                    const rateA = statA.playCount === 0 ? 0 : statA.correctCount / statA.playCount;
                    const rateB = statB.playCount === 0 ? 0 : statB.correctCount / statB.playCount;
                    return rateA - rateB;
                });
            }

            // 重複排除して10問抽出（問題文そのものの一致も防ぐ）
            currentPlaylist = [];
            const textSet = new Set();
            for(let q of pool) {
                if(currentPlaylist.length >= 10) break;
                if(!textSet.has(q.text)) {
                    currentPlaylist.push(q);
                    textSet.add(q.text);
                }
            }

            currentIndex = 0;
            currentCorrectCount = 0;
            sessionStartTime = Date.now();
            showQuestion();
        }

        function showQuestion() {
            const q = currentPlaylist[currentIndex];
            document.getElementById('question-screen').classList.remove('hidden');
            document.getElementById('explanation-area').classList.add('hidden');
            document.getElementById('mini-quiz-area').classList.add('hidden');
            
            document.getElementById('q-counter').innerText = `Q ${currentIndex + 1}/${currentPlaylist.length}`;
            document.getElementById('q-id-display').innerText = `ID: ${q.id}`;
            document.getElementById('q-text').innerText = q.text;

            // 履歴ステータスの表示
            const stat = dbHistory[q.id] || { playCount: 0, correctCount: 0, histStr: "" };
            document.getElementById('stat-play').innerText = stat.playCount;
            document.getElementById('stat-rate').innerText = stat.playCount > 0 ? Math.round((stat.correctCount/stat.playCount)*100) : 0;
            document.getElementById('stat-history').innerText = stat.histStr || "未解答";
        }

        async function checkAnswer(userAns) {
            const q = currentPlaylist[currentIndex];
            const isCorrect = (userAns === q.answer);
            if(isCorrect) currentCorrectCount++;

            // GASへ記録を投げる（非同期で裏側で処理）
            saveAnswerToGAS(q.id, isCorrect);

            // UI更新
            document.getElementById('explanation-area').classList.remove('hidden');
            document.getElementById('judge-mark').innerText = isCorrect ? "〇 正解！" : "✖ 不正解...";
            document.getElementById('judge-mark').className = isCorrect ? "text-2xl font-black text-red-500" : "text-2xl font-black text-blue-500";
            document.getElementById('exp-text').innerText = q.explanation;
            
            document.getElementById('ai-comment').innerText = "考え中...";
            document.getElementById('next-btn').style.display = "none"; // 一時的に隠す

            // コメント生成（高速化のため短い指示）
            let prompt = `生徒が以下の問題に${isCorrect ? "正解" : "不正解"}しました。簡潔な一言コメントをください。\n問題:${q.text}\n解説:${q.explanation}`;
            const comment = await fetchGeminiText(prompt, false);
            document.getElementById('ai-comment').innerText = comment;
            speakWithGemini(comment);

            // 派生ミニクイズの発動（正解時、20%の確率）
            if(isCorrect && Math.random() < 0.2) {
                document.getElementById('mini-quiz-area').classList.remove('hidden');
                document.getElementById('mini-quiz-text').innerText = "派生問題を考え中...";
                const quizPrompt = `今の問題（${q.text}）に関連する、ひねった派生クイズを1問だけ出題してください。`;
                const quiz = await fetchGeminiText(quizPrompt, true); // ここだけProモデル
                document.getElementById('mini-quiz-text').innerText = quiz;
                speakWithGemini("おっ、やるじゃん。じゃあ、これはどう？");
            } else {
                document.getElementById('next-btn').style.display = "block";
            }
        }

        function closeMiniQuiz() {
            document.getElementById('mini-quiz-area').classList.add('hidden');
            document.getElementById('next-btn').style.display = "block";
        }

        async function nextQuestion() {
            currentIndex++;
            if(currentIndex >= currentPlaylist.length) {
                finishTraining();
            } else {
                showQuestion();
                speakWithGemini("次、いくよ。");
            }
        }

        async function finishTraining() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            saveTimeToGAS();

            let prompt = `10問中${currentCorrectCount}問正解でした。今日の勉強を締めくくる、愛ある長文の総括メッセージをください。`;
            const resultMsg = await fetchGeminiText(prompt, false);
            document.getElementById('ai-result-comment').innerText = resultMsg;
            speakWithGemini(resultMsg);
        }
    </script>
</body>
</html>
