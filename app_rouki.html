<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>社労士 過去問トレーニング</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @keyframes timer-run {
            0%   { width: 100%; background-color: #10b981; }
            50%  { width: 50%;  background-color: #f59e0b; }
            80%  { width: 20%;  background-color: #ef4444; }
            100% { width: 0%;   background-color: #ef4444; }
        }
        .typing { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .accordion-content { transition: max-height 0.3s ease-in-out; overflow: hidden; max-height: 0; }
        .accordion-content.open { max-height: 1000px; }
        button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen w-screen flex flex-col md:flex-row overflow-hidden relative select-none font-sans">

    <!-- ⏸️ 離席用オーバーレイ（ペナルティなし） -->
    <div id="pause-overlay" class="absolute inset-0 bg-slate-900/90 z-[100] hidden flex-col items-center justify-center text-white backdrop-blur-sm p-6 text-center">
        <span class="text-6xl md:text-8xl mb-6 animate-bounce">⏸️</span>
        <h2 class="text-3xl md:text-5xl font-black mb-4">ちょっと離席中...</h2>
        <p class="text-lg md:text-xl mb-4 text-slate-300">タイマーは完全に一時停止しています。</p>
        <p class="text-pink-300 font-bold mb-12 text-xl" id="leave-ai-comment">「サボりじゃないよね？信じてるよ」</p>
        <button onclick="resumeTimer()" class="w-full max-w-md bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-black py-5 rounded-2xl text-2xl shadow-[0_6px_0_#166534] active:shadow-[0_2px_0_#166534] active:translate-y-[4px] transition-all">
            ▶ 戻ったよ！（再開）
        </button>
    </div>

    <!-- ☕ 休憩・ペナルティ用オーバーレイ（5分/10分など） -->
    <div id="break-overlay" class="absolute inset-0 bg-slate-900/95 z-[110] hidden flex-col items-center justify-center text-white backdrop-blur-md p-6 text-center">
        <span class="text-6xl md:text-8xl mb-4">☕</span>
        <h2 class="text-3xl md:text-5xl font-black mb-2" id="break-title">休憩タイム！</h2>
        <p class="text-lg md:text-xl mb-8 text-slate-300" id="break-message">目を閉じてしっかり休んでください。</p>
        <div class="text-7xl md:text-9xl font-black mb-4 font-mono tracking-wider" id="break-countdown">05:00</div>
        <p class="text-red-400 font-bold mb-12 h-6 text-lg" id="break-penalty-msg"></p>
        
        <button onclick="endBreak()" class="w-full max-w-md bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-black py-5 rounded-2xl text-2xl shadow-[0_6px_0_#1e3a8a] active:shadow-[0_2px_0_#1e3a8a] active:translate-y-[4px] transition-all">
            ▶ 休憩おわり！（再開）
        </button>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="absolute inset-0 bg-indigo-900 z-50 flex flex-col items-center justify-center text-white p-4 md:p-6 overflow-y-auto">
        <h1 class="text-3xl md:text-5xl font-black mb-6 mt-10 text-center tracking-wider">社労士 過去問トレーニング</h1>
        <div class="bg-white text-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl max-w-2xl w-full mb-10">
            
            <div class="mb-5 p-4 bg-yellow-50 border border-yellow-200 rounded-xl">
                <h2 class="text-sm font-bold mb-2 text-yellow-800">🔑 Gemini APIキー</h2>
                <input type="password" id="api-key-input" placeholder="AI Studioで取得したキーを入力" class="w-full border-2 border-yellow-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-yellow-500">
            </div>

            <!-- 科目・項目選択（アコーディオン＆チェックボックス） -->
            <h2 class="text-xl font-black mb-2 flex justify-between items-end">
                <span>📚 今日のプレイリスト作成</span>
                <span class="text-xs md:text-sm font-bold text-slate-500" id="loading-status">☁️ 読み込み中...</span>
            </h2>
            <div class="flex gap-2 mb-3">
                <button onclick="checkAllChapters(true)" class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg font-bold">☑ すべて選択</button>
                <button onclick="checkAllChapters(false)" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-bold">☐ すべて解除</button>
            </div>
            
            <div id="subject-accordion-container" class="w-full border-2 border-slate-200 rounded-xl mb-5 bg-slate-50 overflow-hidden max-h-56 overflow-y-auto">
                <!-- JavaScriptで科目ごとのアコーディオンが生成されます -->
            </div>

            <div class="flex flex-col md:flex-row gap-4 mb-5">
                <div class="flex-1">
                    <h2 class="text-lg font-black mb-2">🧘 AIのモード</h2>
                    <select id="condition-select" class="w-full bg-pink-50 border-2 border-pink-200 text-base font-bold p-3 rounded-xl focus:outline-none focus:border-pink-500">
                        <option value="自動" selected>🤖 自動おまかせ</option>
                        <option value="普通">普通</option>
                        <option value="Sっ気">Sっ気（小生意気）</option>
                        <option value="熱血">熱血（お姉さん）</option>
                        <option value="ルーレット">🎲 ルーレット</option>
                    </select>
                </div>
                <div class="flex-1">
                    <h2 class="text-lg font-black mb-2">🌡️ あなたの体調</h2>
                    <select id="health-select" class="w-full bg-green-50 border-2 border-green-200 text-base font-bold p-3 rounded-xl focus:outline-none focus:border-green-500">
                        <option value="元気">元気</option>
                        <option value="普通" selected>普通</option>
                        <option value="疲れ気味">疲れ気味</option>
                        <option value="眠い">眠い</option>
                        <option value="病気">病気</option>
                    </select>
                </div>
            </div>

            <h2 class="text-lg font-black mb-2">⏱️ 全体の目標時間</h2>
            <select id="time-limit-select" onchange="toggleCustomTime()" class="w-full bg-blue-50 border-2 border-blue-200 text-base font-bold p-3 rounded-xl mb-2 focus:outline-none focus:border-blue-500">
                <option value="無制限">無制限（限界までやる）</option>
                <option value="1分">テスト用: 1分でタイムアップ</option>
                <option value="15分">15分（スキマ時間）</option>
                <option value="30分">30分（集中）</option>
                <option value="custom">⏰ 自分で終了時刻を指定する</option>
            </select>
            <input type="time" id="custom-time-input" class="hidden w-full border-2 border-blue-300 p-3 rounded-xl text-base font-bold mb-4 focus:outline-none focus:border-blue-500 text-center">

            <button onclick="startTraining()" class="mt-2 w-full bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-black py-4 rounded-xl text-xl shadow-lg transition-transform active:scale-95">
                🚀 特訓スタート！！
            </button>
        </div>
    </div>

    <!-- メイン画面（左側：問題表示領域） -->
    <main class="w-full md:w-1/2 h-[55vh] md:h-screen flex flex-col bg-white shadow-lg z-10 shrink-0">
        <!-- ヘッダー -->
        <div class="bg-indigo-900 text-white shrink-0 shadow-md z-20">
            <div class="p-2 md:p-3 flex justify-between items-center flex-wrap gap-2">
                <div class="flex items-center gap-1.5 shrink-0 flex-wrap">
                    <button onclick="stopTraining()" class="flex items-center gap-1 text-slate-300 hover:text-white font-bold active:scale-95 transition-transform bg-white/10 px-2 py-1 rounded text-xs md:text-sm">
                        <span>🚪</span>
                        <span>終了</span>
                    </button>
                    <button onclick="pauseTimer()" class="flex items-center gap-1 text-slate-300 hover:text-white font-bold active:scale-95 transition-transform bg-white/10 px-2 py-1 rounded border border-slate-500 text-xs md:text-sm">
                        <span>⏸️</span>
                        <span>離席</span>
                    </button>
                    <button onclick="startManualBreak()" class="flex items-center gap-1 text-orange-300 hover:text-orange-400 font-bold active:scale-95 transition-transform bg-orange-900/50 px-2 py-1 rounded border border-orange-500 text-xs md:text-sm">
                        <span>☕</span>
                        <span>5分休憩</span>
                    </button>

                    <!-- 🌡️ 体調変更セレクトボックス（リアルタイム反映） -->
                    <select id="in-game-health" onchange="changeHealthDuringGame(this.value)" class="bg-green-100 text-green-900 text-xs md:text-sm font-bold px-2 py-1 rounded border border-green-300 focus:outline-none cursor-pointer">
                        <option value="元気">体調: 元気 🔥</option>
                        <option value="普通" selected>体調: 普通 🙂</option>
                        <option value="疲れ気味">体調: 疲れ気味 💧</option>
                        <option value="眠い">体調: 眠い 🥱</option>
                        <option value="病気">体調: 病気 🤒</option>
                    </select>

                    <button id="sound-toggle-btn" onclick="toggleSound()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded border border-slate-500 transition-colors">
                        🔇 音声オフ
                    </button>
                </div>
                <div class="flex items-center gap-1.5 justify-end ml-auto">
                    <span id="global-timer-display" class="hidden text-xs font-bold bg-blue-800 px-2.5 py-1 rounded-full border border-blue-600">🏁 00:00</span>
                    <span id="question-progress" class="text-xs font-bold bg-indigo-800 px-2.5 py-1 rounded-full border border-indigo-600">1 / 10問</span>
                    <span id="time-display" class="text-xs font-bold bg-slate-800 text-yellow-400 px-2.5 py-1 rounded-full border border-slate-600 w-16 text-center">⏳ 60秒</span>
                </div>
            </div>
            <!-- 現在のプレイリスト（項目）表示 -->
            <div class="bg-indigo-950 text-indigo-200 text-xs px-3 py-1 text-center font-bold truncate" id="current-playlist-title">
                プレイリスト: 準備中
            </div>
            <div class="w-full h-1.5 bg-indigo-950 overflow-hidden"><div id="timer-bar" class="h-full w-full"></div></div>
        </div>

        <!-- 問題本文・ヒント・まるばつボタン領域 -->
        <div class="p-4 md:p-6 flex-1 flex flex-col justify-between overflow-hidden relative">
            <button id="give-up-btn" onclick="giveUp()" class="hidden absolute top-3 right-3 bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold py-1 px-3 rounded-full shadow-sm text-xs border border-slate-300">
                🏳️ ギブアップ
            </button>

            <!-- 問題文エリア（文字を大きく、縦スクロール可能） -->
            <div class="flex-1 overflow-y-auto pr-2 mb-3">
                <h2 class="text-xl md:text-2xl lg:text-3xl font-extrabold leading-relaxed text-slate-800 tracking-wide" id="question-text">
                    問題文
                </h2>
            </div>
            
            <!-- ヒントボタン -->
            <button onclick="showHint()" class="shrink-0 mb-3 w-full bg-yellow-50 hover:bg-yellow-100 text-yellow-800 font-bold py-2.5 md:py-3 rounded-xl border-2 border-yellow-300 active:scale-[0.98] transition-transform flex items-center justify-center text-base md:text-lg shadow-sm">
                <span class="mr-2 text-xl">💡</span> AIにヒントをもらう
            </button>

            <!-- 〇 ✖ ボタン（大型化・押しやすさ重視） -->
            <div class="shrink-0 flex space-x-4 h-24 md:h-32">
                <button onclick="answer('〇')" class="flex-1 bg-gradient-to-b from-blue-50 to-blue-100 hover:from-blue-100 hover:to-blue-200 text-blue-600 font-black rounded-2xl border-4 border-blue-400 active:scale-95 text-6xl md:text-7xl shadow-md flex items-center justify-center transition-transform">
                    〇
                </button>
                <button onclick="answer('✖')" class="flex-1 bg-gradient-to-b from-red-50 to-red-100 hover:from-red-100 hover:to-red-200 text-red-500 font-black rounded-2xl border-4 border-red-400 active:scale-95 text-6xl md:text-7xl shadow-md flex items-center justify-center transition-transform">
                    ✖
                </button>
            </div>
        </div>
    </main>

    <!-- 右側：AIコーチ・解説エリア -->
    <aside class="w-full md:w-1/2 h-[45vh] md:h-screen bg-slate-50 flex flex-col border-t-2 md:border-t-0 md:border-l-2 border-slate-200 overflow-hidden">
        <!-- AIコメント枠 -->
        <div class="p-3 md:p-4 bg-white border-b border-slate-200 shrink-0">
            <div class="flex items-start">
                <div class="w-12 h-12 md:w-16 md:h-16 rounded-full bg-pink-100 border-2 border-white shadow-sm overflow-hidden shrink-0 flex items-center justify-center">
                    <img src="coach.jpg" alt="AIコーチ" class="w-full h-full object-cover">
                </div>
                <div class="ml-3 flex-grow">
                    <div class="bg-pink-50 rounded-2xl rounded-tl-none p-3 shadow-sm border border-pink-100 relative" id="ai-message-box">
                        <p class="text-slate-700 font-bold leading-relaxed text-sm md:text-base" id="ai-message">
                            APIキーと問題データを読み込んでスタートしてね！
                        </p>
                        <div id="ai-fix-action" class="mt-2 hidden"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 解説表示エリア（大きな文字・細字でゆったり読める構成） -->
        <div id="explanation-area" class="p-3 md:p-5 hidden flex-col flex-1 overflow-y-auto relative">
            <div class="mb-3 text-center shrink-0">
                <span id="result-badge" class="inline-block px-6 py-1.5 rounded-full text-lg md:text-xl font-bold text-white shadow-md">結果</span>
            </div>
            <div class="bg-white rounded-xl p-4 md:p-5 shadow-sm border border-slate-200 mb-3 flex-1 overflow-y-auto">
                <h3 class="text-xs md:text-sm font-bold text-slate-400 mb-1 border-b pb-1">根拠条文</h3>
                <p class="text-indigo-700 font-black mb-3 text-base md:text-lg" id="article-text">法X条</p>
                <h3 class="text-xs md:text-sm font-bold text-slate-400 mb-1 border-b pb-1">解説</h3>
                <p class="text-slate-700 leading-relaxed md:leading-loose font-normal text-lg md:text-xl lg:text-2xl mb-4" id="explanation-text">解説</p>
                
                <button onclick="askProDeeply()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-2.5 rounded-xl shadow hover:from-purple-700 hover:to-indigo-700 transition-all flex items-center justify-center gap-2 text-sm md:text-base">
                    <span>🔥 Pro先生に深掘り質問する</span>
                </button>
            </div>

            <!-- 次へ進む／プレイリスト終了操作ボタン -->
            <div id="self-eval-area" class="shrink-0 p-2 bg-white/95 backdrop-blur-md rounded-xl border border-slate-200">
                <div class="flex gap-2 justify-center" id="action-buttons-container">
                    <button id="btn-next-question" onclick="nextQuestion()" class="flex-1 bg-green-500 hover:bg-green-600 active:scale-95 text-white font-black py-3 rounded-xl shadow-md text-base md:text-lg transition-transform">🟢 次へ進む</button>
                    
                    <button id="btn-another-round" onclick="startAnotherRound()" class="hidden flex-1 bg-blue-500 hover:bg-blue-600 active:scale-95 text-white font-black py-3 rounded-xl shadow-md text-base md:text-lg transition-transform">🔁 もう1周する</button>
                    <button id="btn-ai-spurt" onclick="startAiSpurt()" class="hidden flex-1 bg-gradient-to-r from-pink-500 to-red-500 hover:from-pink-600 hover:to-red-600 active:scale-95 text-white font-black py-3 rounded-xl shadow-md text-base md:text-lg transition-transform">🔥 AIおまかせラストスパート</button>
                </div>
            </div>
        </div>
    </aside>

    <script>
        // 科目別のCSV URL設定
        const SUBJECTS = [
            { id: "rouki", name: "労働基準法", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9QYS2xT-fFDtl0VuvMW2djCXMtU0CvANyXjvwY7ucm1HKEse511OH1uIn6QoKlQdcWXSWR_DFufgc/pub?output=csv" },
            { id: "anei", name: "安全衛生法", url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9QYS2xT-fFDtl0VuvMW2djCXMtU0CvANyXjvwY7ucm1HKEse511OH1uIn6QoKlQdcWXSWR_DFufgc/pub?gid=340566361&single=true&output=csv" }
        ];

        let allDatabase = [];
        let parsedSubjectsCount = 0;

        let selectedChaptersGlobal = [];
        let playlistQueue = [];
        let currentPlaylistIndex = 0;
        let cumulativeQuestions = 0;

        let currentQuestions = [];
        let currentIndex = 0;
        
        let timerInterval = null;
        let timeLeft = 60;
        
        let breakInterval = null;
        let breakSecondsLeft = 0;
        let isBreakMode = false;

        let userCondition = '自動'; 
        let userHealth = '普通';       
        let userApiKey = '';
        let pendingFixData = null; 
        let globalTimerInterval = null;
        let globalTimeLeftSeconds = null; 
        let isMuted = true;
        let isPaused = false;
        
        let sessionQuestionCount = 0;
        let isTimeUp = false;         
        let isOvertimeTriggered = false; 
        let isSuddenDeath = false;    
        let todayMistakes = [];       

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) document.getElementById('api-key-input').value = savedKey;
            loadAllSubjects();
        };

        async function loadAllSubjects() {
            document.getElementById('loading-status').textContent = "☁️ 読み込み中...";
            allDatabase = [];
            parsedSubjectsCount = 0;

            for (const subject of SUBJECTS) {
                if (!subject.url || subject.url.includes("※")) {
                    parsedSubjectsCount++;
                    checkAllLoaded();
                    continue;
                }
                
                try {
                    const response = await fetch(subject.url);
                    const csvText = await response.text();
                    Papa.parse(csvText, {
                        header: true, skipEmptyLines: true,
                        complete: function(results) {
                            let data = results.data.filter(q => q && q.問題文 && String(q.問題文).trim() !== "");
                            data.forEach(q => {
                                q._subjectName = subject.name;
                                q.項目 = q.項目 || "分類なし";
                            });
                            allDatabase = allDatabase.concat(data);
                            parsedSubjectsCount++;
                            checkAllLoaded();
                        }
                    });
                } catch (error) {
                    console.error("読込エラー:", subject.name, error);
                    parsedSubjectsCount++;
                    checkAllLoaded();
                }
            }
        }

        function checkAllLoaded() {
            if (parsedSubjectsCount === SUBJECTS.length) {
                document.getElementById('loading-status').textContent = `✅ 読込完了 (${allDatabase.length}問)`;
                buildSubjectAccordionUI();
            }
        }

        function buildSubjectAccordionUI() {
            const container = document.getElementById('subject-accordion-container');
            container.innerHTML = "";
            
            const subjectMap = {};
            allDatabase.forEach(q => {
                if (!subjectMap[q._subjectName]) subjectMap[q._subjectName] = new Set();
                subjectMap[q._subjectName].add(q.項目);
            });

            if (Object.keys(subjectMap).length === 0) {
                container.innerHTML = "<div class='p-4 text-red-500 font-bold'>データがありません。URLを確認してください。</div>";
                return;
            }

            for (const [subjectName, chaptersSet] of Object.entries(subjectMap)) {
                const chapters = Array.from(chaptersSet);
                
                const header = document.createElement('div');
                header.className = "bg-slate-200 p-3 font-bold cursor-pointer border-b border-white hover:bg-slate-300 flex justify-between";
                header.innerHTML = `<span>${subjectName}</span> <span>▼</span>`;
                header.onclick = function() {
                    const content = this.nextElementSibling;
                    content.classList.toggle('open');
                };

                const content = document.createElement('div');
                content.className = "accordion-content bg-white";
                
                let checkboxHTML = `<div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-2">`;
                chapters.forEach(c => {
                    const val = `${subjectName}::${c}`;
                    checkboxHTML += `
                        <label class="flex items-center space-x-2 cursor-pointer p-2 hover:bg-indigo-50 rounded">
                            <input type="checkbox" name="chapter-check" value="${val}" class="w-5 h-5 text-indigo-600 rounded">
                            <span class="text-sm font-medium">${c}</span>
                        </label>`;
                });
                checkboxHTML += `</div>`;
                content.innerHTML = checkboxHTML;

                container.appendChild(header);
                container.appendChild(content);
            }
        }

        function checkAllChapters(check) {
            const checkboxes = document.querySelectorAll('input[name="chapter-check"]');
            checkboxes.forEach(cb => cb.checked = check);
        }

        function toggleCustomTime() {
            const selectVal = document.getElementById('time-limit-select').value;
            const customInput = document.getElementById('custom-time-input');
            if (selectVal === 'custom') customInput.classList.remove('hidden');
            else customInput.classList.add('hidden');
        }

        function toggleSound() {
            isMuted = !isMuted;
            const btn = document.getElementById('sound-toggle-btn');
            if (isMuted) {
                btn.innerHTML = "🔇 音声オフ";
                btn.className = "bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-2 py-1 rounded border border-slate-500 transition-colors";
                window.speechSynthesis.cancel(); 
            } else {
                btn.innerHTML = "🔊 音声オン";
                btn.className = "bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-2 py-1 rounded border border-green-500 transition-colors";
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
            }
        }

        function speakText(text) {
            if (isMuted) return; 
            const cleanText = text.replace(/<[^>]+>/g, '').replace(/[\*\_]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP';
            const currentMode = getEffectiveCondition();
            if (currentMode === 'Sっ気') { utterance.pitch = 1.3; utterance.rate = 1.3; }
            else if (currentMode === '熱血') { utterance.pitch = 1.2; utterance.rate = 1.2; } 
            else { utterance.pitch = 1.0; utterance.rate = 1.0; }
            window.speechSynthesis.cancel(); 
            window.speechSynthesis.speak(utterance);
        }

        function getEffectiveCondition() {
            if (userCondition === 'ルーレット') {
                const modes = ['普通', 'Sっ気', '熱血'];
                return modes[Math.floor(Math.random() * modes.length)];
            }
            if (userCondition !== '自動') return userCondition; 
            
            const hour = new Date().getHours();
            if (userHealth === '眠い') return 'Sっ気'; 
            if (userHealth === '病気') return '普通';   
            if (userHealth === '疲れ気味') return 'Sっ気'; 
            if (userHealth === '元気') return '熱血';   
            if (hour >= 22 || hour <= 4) return 'Sっ気'; 
            return '普通';
        }

        function changeHealthDuringGame(newHealth) {
            const oldHealth = userHealth;
            userHealth = newHealth;
            document.getElementById('health-select').value = newHealth;
            generateAiMessage("health_changed", { oldHealth: oldHealth, newHealth: newHealth });
        }

        function pauseTimer() {
            if (!document.getElementById('explanation-area').classList.contains('hidden')) return;
            isPaused = true;
            clearInterval(timerInterval);
            clearInterval(globalTimerInterval);
            
            const timerBar = document.getElementById('timer-bar');
            if(timerBar) timerBar.style.animationPlayState = 'paused';
            
            const comments = ["サボりじゃないよね？信じてるよ", "早く戻ってきなさいよ", "急いでね！待ってるから"];
            document.getElementById('leave-ai-comment').textContent = `「${comments[Math.floor(Math.random() * comments.length)]}」`;

            document.getElementById('pause-overlay').classList.remove('hidden');
            document.getElementById('pause-overlay').classList.add('flex');
        }

        function resumeTimer() {
            isPaused = false;
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('pause-overlay').classList.remove('flex');
            
            const timerBar = document.getElementById('timer-bar');
            if(timerBar) timerBar.style.animationPlayState = 'running';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').textContent = `⏳ ${timeLeft}秒`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);

            if (globalTimeLeftSeconds !== null && !isTimeUp) {
                globalTimerInterval = setInterval(globalTimerTick, 1000);
            }
        }

        function startManualBreak() {
            if (!document.getElementById('explanation-area').classList.contains('hidden')) return;
            executeBreak(5, false);
        }

        function startAutoBreak(minutes) {
            executeBreak(minutes, true);
        }

        function executeBreak(minutes, isAuto) {
            isPaused = true;
            isBreakMode = true;
            clearInterval(timerInterval);
            clearInterval(globalTimerInterval);
            const timerBar = document.getElementById('timer-bar');
            if(timerBar) timerBar.style.animationPlayState = 'paused';

            document.getElementById('break-title').textContent = isAuto ? "目標達成！自動休憩" : "☕ 手動休憩タイム";
            document.getElementById('break-message').textContent = isAuto ? `よく頑張りました！${minutes}分間しっかり休んでください。` : `${minutes}分間のリフレッシュタイムです。`;
            document.getElementById('break-penalty-msg').textContent = "";
            
            breakSecondsLeft = minutes * 60;
            updateBreakDisplay();

            document.getElementById('break-overlay').classList.remove('hidden');
            document.getElementById('break-overlay').classList.add('flex');

            breakInterval = setInterval(() => {
                breakSecondsLeft--;
                updateBreakDisplay();
                if (breakSecondsLeft < 0 && globalTimeLeftSeconds !== null && !isTimeUp) {
                    globalTimeLeftSeconds--;
                    updateGlobalTimer();
                    document.getElementById('break-penalty-msg').textContent = `⚠️ 超過ペナルティ中！ 全体時間が削られています！`;
                }
            }, 1000);
        }

        function updateBreakDisplay() {
            let absSec = Math.abs(breakSecondsLeft);
            let m = Math.floor(absSec / 60).toString().padStart(2, '0');
            let s = (absSec % 60).toString().padStart(2, '0');
            let sign = breakSecondsLeft < 0 ? "-" : "";
            const displayEl = document.getElementById('break-countdown');
            displayEl.textContent = `${sign}${m}:${s}`;
            displayEl.className = breakSecondsLeft < 0 
                ? "text-7xl md:text-9xl font-black mb-4 font-mono tracking-wider text-red-500 animate-pulse" 
                : "text-7xl md:text-9xl font-black mb-4 font-mono tracking-wider text-emerald-400";
        }

        function endBreak() {
            clearInterval(breakInterval);
            isBreakMode = false;
            document.getElementById('break-overlay').classList.add('hidden');
            document.getElementById('break-overlay').classList.remove('flex');
            cumulativeQuestions = 0;
            
            if (currentIndex >= currentQuestions.length) {
                showEndOfPlaylistOptions();
                return;
            }
            resumeTimer();
        }

        function stopTraining() {
            if(confirm("特訓を中断してスタート画面に戻りますか？")) {
                location.reload();
            }
        }

        function startTraining() {
            userApiKey = document.getElementById('api-key-input').value.trim();
            if (!userApiKey) { alert("APIキーを入力してください！"); return; }
            localStorage.setItem('gemini_api_key', userApiKey);

            const checkboxes = document.querySelectorAll('input[name="chapter-check"]:checked');
            if (checkboxes.length === 0) {
                alert("学習する項目を最低1つは選択してください！");
                return;
            }

            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

            userCondition = document.getElementById('condition-select').value;
            userHealth = document.getElementById('health-select').value;
            document.getElementById('in-game-health').value = userHealth;
            
            sessionQuestionCount = 0;
            cumulativeQuestions = 0;
            isTimeUp = false;
            isOvertimeTriggered = false;
            isSuddenDeath = false;
            todayMistakes = [];
            document.getElementById('give-up-btn').classList.add('hidden');

            const timeLimitVal = document.getElementById('time-limit-select').value;
            if (timeLimitVal === '無制限') {
                globalTimeLeftSeconds = null;
            } else if (timeLimitVal === 'custom') {
                const customTimeStr = document.getElementById('custom-time-input').value;
                if (!customTimeStr) { alert("終了時刻を入力してください！"); return; }
                const [hours, minutes] = customTimeStr.split(':');
                const now = new Date();
                const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(hours), parseInt(minutes), 0);
                if (target <= now) target.setDate(target.getDate() + 1);
                globalTimeLeftSeconds = Math.floor((target - now) / 1000);
            } else if (timeLimitVal === '1分') {
                globalTimeLeftSeconds = 60; 
            } else {
                globalTimeLeftSeconds = parseInt(timeLimitVal.replace('分','')) * 60;
            }

            if (globalTimeLeftSeconds !== null) {
                document.getElementById('global-timer-display').classList.remove('hidden');
                updateGlobalTimer();
                globalTimerInterval = setInterval(globalTimerTick, 1000);
            }

            selectedChaptersGlobal = Array.from(checkboxes).map(cb => cb.value);
            buildPlaylistQueue();

            document.getElementById('start-screen').classList.add('hidden');
            startNextPlaylistSet(true); 
        }

        function globalTimerTick() {
            globalTimeLeftSeconds--;
            if (globalTimeLeftSeconds > 0) {
                updateGlobalTimer();
            } else {
                isTimeUp = true;
                clearInterval(globalTimerInterval);
                document.getElementById('global-timer-display').textContent = '🏁 目標時間到達';
                document.getElementById('global-timer-display').className = "text-xs font-bold bg-red-600 px-2.5 py-1 rounded-full border border-red-800 animate-pulse";
            }
        }

        function buildPlaylistQueue() {
            playlistQueue = [];
            selectedChaptersGlobal.forEach(val => {
                const [subj, chap] = val.split("::");
                let pool = allDatabase.filter(q => q._subjectName === subj && q.項目 === chap);
                if(pool.length > 0) {
                    let questions = pool.sort(() => Math.random() - 0.5).slice(0, 10);
                    playlistQueue.push({
                        subjectName: subj,
                        chapterName: chap,
                        questions: questions
                    });
                }
            });
            currentPlaylistIndex = 0;
        }

        function startNextPlaylistSet(isVeryFirst = false) {
            if (currentPlaylistIndex >= playlistQueue.length) {
                handlePlaylistComplete();
                return;
            }

            const currentSet = playlistQueue[currentPlaylistIndex];
            currentQuestions = currentSet.questions;
            currentIndex = 0;

            document.getElementById('current-playlist-title').textContent = `🎧 プレイリスト [${currentPlaylistIndex + 1}/${playlistQueue.length}] : ${currentSet.subjectName} - ${currentSet.chapterName}`;
            
            document.getElementById('btn-next-question').classList.remove('hidden');
            document.getElementById('btn-another-round').classList.add('hidden');
            document.getElementById('btn-ai-spurt').classList.add('hidden');

            loadQuestion(isVeryFirst);
        }

        function updateGlobalTimer() {
            if (globalTimeLeftSeconds === null) return;
            const h = Math.floor(globalTimeLeftSeconds / 3600);
            const m = Math.floor((globalTimeLeftSeconds % 3600) / 60);
            const s = globalTimeLeftSeconds % 60;
            if(h > 0) document.getElementById('global-timer-display').textContent = `🏁 残り ${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            else document.getElementById('global-timer-display').textContent = `🏁 残り ${m}:${s.toString().padStart(2, '0')}`;
        }

        function loadQuestion(isStart = false) {
            const q = currentQuestions[currentIndex];
            if (!q) return;

            document.getElementById('question-progress').textContent = `${currentIndex + 1} / ${currentQuestions.length} 問`;
            document.getElementById('question-text').textContent = q.問題文;
            document.getElementById('explanation-area').classList.add('hidden');
            
            if (isStart) generateAiMessage("start");
            else if (!isOvertimeTriggered) generateAiMessage("next"); 
            
            verifyDataWithPro(q);

            clearInterval(timerInterval);

            let questionTimeLimit = 60;
            timeLeft = questionTimeLimit;
            document.getElementById('time-display').textContent = `⏳ ${timeLeft}秒`;
            
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.animation = 'none';
            void timerBar.offsetWidth; 
            timerBar.style.animation = `timer-run ${questionTimeLimit}s linear forwards`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').textContent = `⏳ ${timeLeft}秒`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        function showHint() {
            const q = currentQuestions[currentIndex];
            generateAiMessage("hint", { questionText: q.問題文, explanation: q.解説 || "" });
        }

        function answer(userAnswer) {
            const q = currentQuestions[currentIndex];
            clearInterval(timerInterval);
            document.getElementById('timer-bar').style.animationPlayState = 'paused';

            const correctStr = (q.正誤 || "").trim();
            const isCorrect = (userAnswer === '〇' && (correctStr === '〇' || correctStr === '○')) || 
                              (userAnswer === '✖' && (correctStr === '✖' || correctStr === '×'));

            if (!isCorrect) todayMistakes.push(q);
            cumulativeQuestions++;
            sessionQuestionCount++;

            if (isSuddenDeath && !isCorrect) {
                alert("💀 痛恨のミス！サドンデスモードにより強制終了します。");
                location.reload();
                return;
            }

            document.getElementById('explanation-area').classList.remove('hidden');
            document.getElementById('explanation-area').classList.add('flex');

            const badge = document.getElementById('result-badge');
            if (isCorrect) {
                badge.textContent = "大正解！ 🎉";
                badge.className = "inline-block px-6 py-1.5 rounded-full text-lg md:text-xl font-bold text-white bg-green-500 animate-bounce shadow-md";
            } else {
                badge.textContent = "不正解... 💦";
                badge.className = "inline-block px-6 py-1.5 rounded-full text-lg md:text-xl font-bold text-white bg-red-500 shadow-md";
            }

            document.getElementById('article-text').textContent = q.根拠条文 || '条文なし';
            document.getElementById('explanation-text').innerHTML = q.解説 || '解説なし';

            if (currentIndex >= currentQuestions.length - 1) {
                document.getElementById('btn-next-question').textContent = "🟢 次のセットへ（または判定）";
            } else {
                document.getElementById('btn-next-question').textContent = "🟢 次へ進む";
            }

            generateAiMessage("answer", { isCorrect: isCorrect, questionText: q.問題文 });
        }

        function nextQuestion() {
            currentIndex++;
            
            if (currentIndex >= currentQuestions.length) {
                currentPlaylistIndex++;
                startNextPlaylistSet();
            } else {
                loadQuestion();
            }
        }

        function handlePlaylistComplete() {
            if (cumulativeQuestions >= 100) {
                startAutoBreak(10);
                return;
            } else if (cumulativeQuestions >= 40) {
                startAutoBreak(5);
                return;
            }
            showEndOfPlaylistOptions();
        }

        function showEndOfPlaylistOptions() {
            document.getElementById('explanation-area').classList.remove('hidden');
            document.getElementById('explanation-area').classList.add('flex');

            if (isTimeUp && !isOvertimeTriggered) {
                handleOvertimeRoulette();
            } else if (!isTimeUp) {
                document.getElementById('ai-message').innerHTML = "プレイリスト完走！でもまだ時間が残ってるよ！<br>もう1周するか、アタシにおまかせするか選びな！";
                
                document.getElementById('btn-next-question').classList.add('hidden');
                document.getElementById('btn-another-round').classList.remove('hidden');
                document.getElementById('btn-ai-spurt').classList.remove('hidden');
            } else {
                alert("追加の課題をすべてクリアしました！本日は終了です、お疲れ様でした！");
                location.reload();
            }
        }

        function startAnotherRound() {
            buildPlaylistQueue();
            startNextPlaylistSet(false);
        }

        function startAiSpurt() {
            document.getElementById('current-playlist-title').textContent = `🔥 AIおまかせラストスパート！`;
            document.getElementById('btn-next-question').classList.remove('hidden');
            document.getElementById('btn-another-round').classList.add('hidden');
            document.getElementById('btn-ai-spurt').classList.add('hidden');

            currentQuestions = [];
            if (todayMistakes.length > 0) {
                let mistakes = todayMistakes.sort(() => Math.random() - 0.5).slice(0, 5);
                currentQuestions = currentQuestions.concat(mistakes);
            }
            let remain = 10 - currentQuestions.length;
            if (remain > 0) {
                let randoms = allDatabase.sort(() => Math.random() - 0.5).slice(0, remain);
                currentQuestions = currentQuestions.concat(randoms);
            }

            playlistQueue = [{ subjectName: "全科目", chapterName: "AIセレクト", questions: currentQuestions }];
            currentPlaylistIndex = 0;
            currentIndex = 0;
            
            loadQuestion(false);
        }

        function handleOvertimeRoulette() {
            isOvertimeTriggered = true; 
            const roll = Math.floor(Math.random() * 10) + 1; 
            const cond = getEffectiveCondition();

            document.getElementById('ai-message-box').className = "bg-red-100 rounded-2xl p-4 shadow-sm border border-red-300 relative";
            document.getElementById('give-up-btn').classList.remove('hidden'); 
            
            document.getElementById('btn-next-question').classList.remove('hidden');
            document.getElementById('btn-another-round').classList.add('hidden');
            document.getElementById('btn-ai-spurt').classList.add('hidden');

            if (cond === 'Sっ気') {
                if (roll <= 6) { 
                    generateAiMessage("roulette_s_10");
                    setRouletteQuestions(allDatabase, 10);
                } else if (roll <= 9) { 
                    generateAiMessage("roulette_s_end");
                    setTimeout(() => { alert("今日はここまで。お疲れ様でした。"); location.reload(); }, 5000);
                } else { 
                    isSuddenDeath = true;
                    generateAiMessage("roulette_s_20");
                    setRouletteQuestions(allDatabase, 20);
                }
            } else if (cond === '熱血') {
                if (roll <= 3) { 
                    generateAiMessage("roulette_n_random");
                    setRouletteQuestions(allDatabase, 10);
                } else if (roll <= 6) { 
                    generateAiMessage("roulette_n_mistake");
                    setRouletteQuestions(todayMistakes.length > 0 ? todayMistakes : allDatabase, 10);
                } else if (roll <= 9) { 
                    generateAiMessage("roulette_n_weak");
                    setRouletteQuestions(allDatabase, 10);
                } else { 
                    generateAiMessage("roulette_n_end");
                    setTimeout(() => { alert("今日の特訓は終了！よく頑張ったな！"); location.reload(); }, 5000);
                }
            } else {
                alert("目標時間が終了しました。今日の学習はここまでです！お疲れ様でした！");
                location.reload();
            }
        }

        function setRouletteQuestions(pool, count) {
            let extra = pool.sort(() => Math.random() - 0.5).slice(0, count);
            playlistQueue = [{ subjectName: "残業ルーレット", chapterName: "特別課題", questions: extra }];
            currentPlaylistIndex = 0;
            currentQuestions = extra;
            currentIndex = -1;
            document.getElementById('btn-next-question').textContent = "🟢 課題スタート！";
        }

        function giveUp() {
            const cond = getEffectiveCondition();
            if (cond === 'Sっ気') {
                generateAiMessage("give_up_s");
            } else {
                generateAiMessage("give_up_n");
            }
            setTimeout(() => {
                alert("学習を終了します。ゆっくり休んでください！");
                location.reload();
            }, 5000);
        }

        async function generateAiMessage(situation, extraData = {}) {
            const aiMessageEl = document.getElementById('ai-message');
            document.getElementById('ai-fix-action').classList.add('hidden');
            aiMessageEl.innerHTML = '<span class="typing">💬 考えてるよ...</span>';
            
            const effectiveCond = getEffectiveCondition();
            
            let prompt = `あなたは社労士試験をサポートする専属AIコーチです。以下の状況と性格設定を判断して、1〜2文の短い話し言葉でコメントしてください。（「AIとして〜」等の前置きは厳禁。自然な会話調）\n\n`;
            
            if (effectiveCond === 'Sっ気') prompt += `【性格】タメ口でフランク、小生意気な若い後輩コーチ。上から目線で煽るが嫌な気持ちにさせずモチベを刺激する。\n`;
            else if (effectiveCond === '熱血') prompt += `【性格】明るく前向きな体育会系の姉御肌。「〜だろ」「〜よ！」「〜しな！」と頼もしく引っ張る。\n`;
            else prompt += `【性格】丁寧で前向き、優しく寄り添う女性コーチ。\n`;

            if (situation === "start") prompt += `【状況】学習を開始します。現在の体調は「${userHealth}」です。気合を入れて！`;
            else if (situation === "health_changed") prompt += `【状況】学習中にユーザーが体調を「${extraData.oldHealth}」から「${extraData.newHealth}」に変更しました。その体調変化に気づいた一言をかけて！`;
            else if (situation === "next") prompt += `【状況】次の問題へ進みました。体調「${userHealth}」を考慮しつつ短く言葉をかけて。`;
            else if (situation === "hint") prompt += `【状況】ユーザーがヒントを求めています。答えは言わず1文で注目ポイントを示唆して！\n問題: ${extraData.questionText}\n解説: ${extraData.explanation}`;
            else if (situation === "answer") prompt += `【状況】ユーザーが解答しました。結果: ${extraData.isCorrect ? "正解！" : "不正解..."}\n問題: ${extraData.questionText.substring(0,30)}...`;
            else if (situation === "roulette_s_10") prompt += `【状況】目標時間が終了したがルーレットで【10問追加】決定。休もうとしていることを見透かして冷たく追加課題を命じて。`;
            else if (situation === "roulette_s_end") prompt += `【状況】目標時間が終了し【今日はおしまい】決定。呆れつつほんの少しだけ労い終了を告げて。`;
            else if (situation === "roulette_s_20") prompt += `【状況】ルーレットで【20問追加（無限サドンデス）】決定。絶望する顔を楽しむように地獄の20問をプレゼントして。`;
            else if (situation === "roulette_n_random") prompt += `【状況】ルーレットで【ランダム10問追加】決定。スポ根のノリで熱く追加を告げて。`;
            else if (situation === "roulette_n_mistake") prompt += `【状況】ルーレットで【今日間違えた問題10問】決定。愛のムチとして気合を入れ直させて。`;
            else if (situation === "roulette_n_weak") prompt += `【状況】ルーレットで【過去の正解率が低い問題10問】決定。「壁をぶち破れ」と力強く背中を押して。`;
            else if (situation === "roulette_n_end") prompt += `【状況】ルーレットで【今日はおしまい】決定。厳しい特訓を心から褒め称え、しっかり休むよう命令して。`;
            else if (situation === "give_up_s") prompt += `【状況】サドンデスの途中でユーザーがギブアップ。「情けないですね」と毒を吐きつつ裏に優しさを滲ませて許可して。`;
            else if (situation === "give_up_n") prompt += `【状況】延長戦の途中でユーザーがギブアップ。限界まで食らいついた労いと明るい激励で締めて。`;

            // ▼ 日常の会話・煽りなどは最速の Flash モデル（明示的なバージョン指定 002）
            callGeminiAPI('gemini-1.5-flash-002', prompt, (text) => {
                aiMessageEl.innerHTML = text;
                speakText(text); 
            });
        }

        async function verifyDataWithPro(q) {
            if (q._verified) return; 
            const prompt = `あなたはデータ検証プロです。以下の過去問データに矛盾がないか検証して。\n問題文: ${q.問題文}\nデータ正誤: ${q.正誤}\n解説: ${q.解説}\n問題なければ「OK」、矛盾があれば「NG | 〇か✖ | 理由」の形式で回答。`;
            
            // ▼ 裏側でのデータ正誤検証は賢い Pro モデル（明示的なバージョン指定 002）
            callGeminiAPI('gemini-1.5-pro-002', prompt, (text) => {
                q._verified = true; 
                if (text.startsWith("NG")) {
                    const parts = text.split("|");
                    pendingFixData = { question: q, correctChoice: (parts[1] || "").trim() };
                    document.getElementById('ai-message').innerHTML = `⚠️ <b>Pro検証アラート！</b><br>${(parts[2] || "").trim()}<br>正誤を<b>【${pendingFixData.correctChoice}】</b>に修正しますか？`;
                    document.getElementById('ai-fix-action').innerHTML = `
                        <div class="flex gap-2"><button onclick="applyFix()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-3 py-1 rounded text-xs">✅ 修正する</button><button onclick="ignoreFix()" class="bg-slate-400 hover:bg-slate-500 text-white font-bold px-3 py-1 rounded text-xs">❌ そのまま</button></div>
                    `;
                    document.getElementById('ai-fix-action').classList.remove('hidden');
                }
            });
        }

        function applyFix() {
            if (pendingFixData) {
                pendingFixData.question.正誤 = pendingFixData.correctChoice;
                document.getElementById('ai-fix-action').classList.add('hidden');
                document.getElementById('ai-message').innerHTML = "修正を適用したよ！";
            }
        }

        function ignoreFix() {
            document.getElementById('ai-fix-action').classList.add('hidden');
            document.getElementById('ai-message').innerHTML = "了解！元のデータのままで進めるね。";
        }

        function askProDeeply() {
            const q = currentQuestions[currentIndex];
            document.getElementById('ai-message').innerHTML = '<span class="typing">🔥 Pro先生が深い背景を整理中...</span>';
            const prompt = `あなたは最高峰講師です。以下の問題の背景や立法趣旨を深く分かりやすく解説して。\n条文: ${q.根拠条文}\n問題文: ${q.問題文}\n解説: ${q.解説}`;
            
            // ▼ ユーザーからの深掘り解説要請は賢い Pro モデル（明示的なバージョン指定 002）
            callGeminiAPI('gemini-1.5-pro-002', prompt, (text) => { document.getElementById('ai-message').innerHTML = `🎓 <b>Pro講義</b><br>${text}`; });
        }

        async function callGeminiAPI(model, prompt, callback) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${userApiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `通信エラー (HTTP ${response.status})`);
                }
                
                const data = await response.json();
                callback(data.candidates[0].content.parts[0].text);
            } catch (err) { 
                console.error("Gemini API エラー:", err);
                const aiMessageEl = document.getElementById('ai-message');
                if (aiMessageEl) {
                    aiMessageEl.innerHTML = `⚠️ <b>API通信エラーが発生しました</b><br><span class="text-xs text-red-500">${err.message}</span><br>APIキーが間違っているか、通信環境の問題です。`;
                }
            }
        }
    </script>
</body>
