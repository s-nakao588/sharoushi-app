<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自分専用 社労士学習アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @keyframes timer-run {
            0%   { width: 100%; background-color: #10b981; }
            50%  { width: 50%;  background-color: #f59e0b; }
            80%  { width: 20%;  background-color: #ef4444; }
            100% { width: 0%;   background-color: #ef4444; }
        }
        .typing { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden relative">

    <!-- 離席用オーバーレイ -->
    <div id="pause-overlay" class="absolute inset-0 bg-slate-900/90 z-[100] hidden flex-col items-center justify-center text-white backdrop-blur-sm p-6 text-center">
        <span class="text-6xl md:text-8xl mb-6 animate-bounce">☕</span>
        <h2 class="text-3xl md:text-5xl font-black mb-4">ちょっと離席中...</h2>
        <p class="text-lg md:text-xl mb-12 text-slate-300">タイマーは一時停止しています。</p>
        <button onclick="resumeTimer()" class="w-full max-w-md bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-black py-5 rounded-2xl text-2xl shadow-[0_6px_0_#166534] active:shadow-[0_2px_0_#166534] active:translate-y-[4px] transition-all">
            ▶ 戻ったよ！（再開）
        </button>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="absolute inset-0 bg-indigo-900 z-50 flex flex-col items-center justify-center text-white p-6 overflow-y-auto">
        <h1 class="text-3xl md:text-5xl font-black mb-8 mt-10">社労士 過去問トレーニング</h1>
        <div class="bg-white text-slate-800 p-8 rounded-2xl shadow-2xl max-w-lg w-full mb-10">
            
            <div class="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-xl">
                <h2 class="text-sm font-bold mb-2 text-yellow-800">🔑 Gemini APIキー</h2>
                <input type="password" id="api-key-input" placeholder="AI Studioで取得したキーを入力" class="w-full border-2 border-yellow-300 p-2 rounded text-sm focus:outline-none focus:border-yellow-500">
            </div>

            <h2 class="text-xl font-bold mb-3">📚 学習メニュー</h2>
            <select id="chapter-select" class="w-full bg-slate-100 border-2 border-slate-200 text-lg font-bold p-3 rounded-xl mb-6 focus:outline-none focus:border-indigo-500">
                <option value="">☁️ スプレッドシートから読み込み中...</option>
            </select>

            <div class="flex gap-4 mb-6">
                <div class="flex-1">
                    <h2 class="text-xl font-bold mb-3">🧘 AIのモード</h2>
                    <select id="condition-select" class="w-full bg-pink-50 border-2 border-pink-200 text-lg font-bold p-3 rounded-xl focus:outline-none focus:border-pink-500">
                        <option value="自動" selected>🤖 自動おまかせ</option>
                        <option value="普通">普通</option>
                        <option value="Sっ気">Sっ気（小生意気）</option>
                        <option value="熱血">熱血（お姉さん）</option>
                        <option value="ルーレット">🎲 ルーレット</option>
                    </select>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-bold mb-3">🌡️ あなたの体調</h2>
                    <select id="health-select" class="w-full bg-green-50 border-2 border-green-200 text-lg font-bold p-3 rounded-xl focus:outline-none focus:border-green-500">
                        <option value="元気">元気</option>
                        <option value="普通" selected>普通</option>
                        <option value="疲れ気味">疲れ気味</option>
                        <option value="眠い">眠い</option>
                        <option value="病気">病気</option>
                    </select>
                </div>
            </div>

            <h2 class="text-xl font-bold mb-3">⏱️ 全体の目標時間</h2>
            <select id="time-limit-select" onchange="toggleCustomTime()" class="w-full bg-blue-50 border-2 border-blue-200 text-lg font-bold p-3 rounded-xl mb-2 focus:outline-none focus:border-blue-500">
                <option value="無制限">無制限（限界までやる）</option>
                <option value="1分">テスト用: 1分でタイムアップ</option>
                <option value="15分">15分（スキマ時間）</option>
                <option value="30分">30分（集中）</option>
                <option value="custom">⏰ 自分で終了時刻を指定する</option>
            </select>
            <input type="time" id="custom-time-input" class="hidden w-full border-2 border-blue-300 p-3 rounded-xl text-lg font-bold mb-8 focus:outline-none focus:border-blue-500 text-center">

            <button onclick="startTraining()" class="mt-4 w-full bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-black py-4 rounded-xl text-xl shadow-lg transition-transform active:scale-95">
                🚀 特訓スタート！！
            </button>
        </div>
    </div>

    <!-- メイン画面 -->
    <main class="w-full md:w-1/2 h-[50vh] md:h-screen flex flex-col bg-white shadow-lg z-10 overflow-y-auto">
        <div class="bg-indigo-900 text-white sticky top-0 shadow-md z-20">
            <div class="p-3 md:p-4 flex justify-between items-center flex-wrap gap-2">
                <div class="flex items-center gap-2 shrink-0 flex-wrap">
                    <button onclick="stopTraining()" class="flex items-center gap-1 text-slate-300 hover:text-white font-bold active:scale-95 transition-transform bg-white/10 px-2 py-1 rounded">
                        <span class="text-base md:text-lg">⏸️</span>
                        <span class="hidden sm:inline text-xs md:text-sm">中断</span>
                    </button>
                    <button onclick="pauseTimer()" class="flex items-center gap-1 text-orange-300 hover:text-orange-400 font-bold active:scale-95 transition-transform bg-white/10 px-2 py-1 rounded">
                        <span class="text-base md:text-lg">☕</span>
                        <span class="hidden sm:inline text-xs md:text-sm">離席</span>
                    </button>
                    <select id="in-game-condition" onchange="changeCondition(this.value)" class="bg-pink-100 text-pink-800 text-xs md:text-sm font-bold px-2 py-1 rounded border border-pink-300 focus:outline-none cursor-pointer">
                        <option value="自動">AI: 自動</option>
                        <option value="普通">AI: 普通</option>
                        <option value="Sっ気">AI: Sっ気</option>
                        <option value="熱血">AI: 熱血</option>
                        <option value="ルーレット">AI: 🎲 ルーレット</option>
                    </select>
                    <button id="sound-toggle-btn" onclick="toggleSound()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs md:text-sm font-bold px-3 py-1 rounded border border-slate-500 transition-colors">
                        🔇 音声オフ
                    </button>
                </div>
                <div class="flex items-center gap-2 justify-end ml-auto">
                    <span id="global-timer-display" class="hidden text-xs md:text-sm font-bold bg-blue-800 px-3 py-1 rounded-full border border-blue-600">🏁 00:00</span>
                    <span id="question-progress" class="text-xs md:text-sm font-bold bg-indigo-800 px-3 py-1 rounded-full border border-indigo-600">1 / 10問</span>
                    <span id="time-display" class="text-xs md:text-sm font-bold bg-slate-800 text-yellow-400 px-3 py-1 rounded-full border border-slate-600 w-20 text-center">⏳ 60秒</span>
                </div>
            </div>
            <div class="w-full h-2 bg-indigo-950 overflow-hidden"><div id="timer-bar" class="h-full w-full"></div></div>
        </div>

        <div class="p-6 md:p-8 flex-grow flex flex-col justify-center relative">
            <button id="give-up-btn" onclick="giveUp()" class="hidden absolute top-4 right-4 bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold py-2 px-4 rounded-full shadow-sm text-sm border border-slate-300 transition-colors">
                🏳️ もう勘弁して...
            </button>

            <h2 class="text-lg md:text-2xl font-bold leading-loose text-slate-700 mb-8" id="question-text">問題文</h2>
            
            <button onclick="showHint()" class="mb-8 w-full bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-bold py-4 rounded-xl border-2 border-yellow-300 transition-transform active:scale-95 flex items-center justify-center text-lg shadow-sm">
                <span class="mr-2 text-2xl">💡</span> AIにヒントをもらう
            </button>
            <div class="flex space-x-4 mt-auto">
                <button onclick="answer('〇')" class="flex-1 bg-white hover:bg-blue-50 text-blue-600 font-bold py-6 rounded-2xl border-4 border-blue-200 active:bg-blue-100 text-4xl shadow-sm">〇</button>
                <button onclick="answer('✖')" class="flex-1 bg-white hover:bg-red-50 text-red-500 font-bold py-6 rounded-2xl border-4 border-red-200 active:bg-red-100 text-4xl shadow-sm">✖</button>
            </div>
        </div>
    </main>

    <aside class="w-full md:w-1/2 h-[50vh] md:h-screen bg-slate-50 flex flex-col overflow-y-auto border-l-2 border-slate-200">
        <div class="p-4 md:p-6 bg-white border-b border-slate-200 shrink-0">
            <div class="flex items-start">
                <div class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-pink-100 border-2 border-white shadow-sm overflow-hidden shrink-0 flex items-center justify-center">
                    <!-- 18歳の可愛らしい女性アイコン（前髪・ロング・チークあり）に修正 -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-full h-full">
                        <rect width="100" height="100" fill="#fce7f3"/>
                        <!-- 後ろ髪 -->
                        <path d="M 20 40 Q 20 80 25 100 L 75 100 Q 80 80 80 40 Z" fill="#4a3b31" />
                        <!-- 顔 -->
                        <circle cx="50" cy="55" r="22" fill="#ffceb4" />
                        <!-- 前髪 -->
                        <path d="M 25 50 Q 30 20 50 20 Q 70 20 75 50 Q 60 40 50 35 Q 40 40 25 50 Z" fill="#4a3b31" />
                        <path d="M 45 20 L 50 40 L 55 20 Z" fill="#4a3b31" />
                        <path d="M 35 25 L 35 43 L 43 25 Z" fill="#4a3b31" />
                        <!-- 目 -->
                        <circle cx="41" cy="54" r="3" fill="#2d1b13" />
                        <circle cx="59" cy="54" r="3" fill="#2d1b13" />
                        <!-- チーク -->
                        <circle cx="36" cy="58" r="3" fill="#fb7185" opacity="0.6" />
                        <circle cx="64" cy="58" r="3" fill="#fb7185" opacity="0.6" />
                        <!-- 口 -->
                        <path d="M 46 63 Q 50 67 54 63" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="ml-3 md:ml-4 flex-grow">
                    <div class="bg-pink-50 rounded-2xl rounded-tl-none p-3 md:p-4 shadow-sm border border-pink-100 relative" id="ai-message-box">
                        <p class="text-slate-700 font-bold leading-relaxed text-sm md:text-base" id="ai-message">
                            APIキーと問題データを読み込んでスタートしてね！
                        </p>
                        <div id="ai-fix-action" class="mt-3 hidden"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="explanation-area" class="p-4 md:p-6 hidden flex-col flex-grow relative pb-32">
            <div class="mb-4 text-center">
                <span id="result-badge" class="inline-block px-6 md:px-8 py-2 rounded-full text-xl md:text-2xl font-bold text-white shadow-md">結果</span>
            </div>
            <div class="bg-white rounded-xl p-4 md:p-5 shadow-sm border border-slate-200 mb-4">
                <h3 class="text-sm font-bold text-slate-400 mb-2 border-b pb-2">根拠条文</h3>
                <p class="text-indigo-700 font-black mb-4 text-base md:text-lg" id="article-text">法X条</p>
                <h3 class="text-sm font-bold text-slate-400 mb-2 border-b pb-2">解説</h3>
                <p class="text-slate-700 leading-loose font-medium text-sm md:text-base mb-4" id="explanation-text">解説</p>
                
                <button onclick="askProDeeply()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-xl shadow hover:from-purple-700 hover:to-indigo-700 transition-all flex items-center justify-center gap-2">
                    <span>🔥 Pro先生に深掘り質問する</span>
                </button>
            </div>

            <div id="self-eval-area" class="absolute bottom-0 left-0 w-full p-2 md:p-4 bg-white/95 backdrop-blur-md border-t border-slate-200">
                <div class="flex gap-2 justify-center">
                    <button onclick="nextQuestion()" class="flex-1 bg-green-50 hover:bg-green-500 hover:text-white text-green-700 font-bold py-3 rounded-xl border border-green-200">🟢 次へ進む</button>
                </div>
            </div>
        </div>
    </aside>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9QYS2xT-fFDtl0VuvMW2djCXMtU0CvANyXjvwY7ucm1HKEse511OH1uIn6QoKlQdcWXSWR_DFufgc/pub?output=csv";
        let database = []; 
        let currentQuestions = [];
        let currentIndex = 0;
        let validDatabase = []; 
        let timerInterval = null;
        let timeLeft = 60;
        let idleTimeout = null; 
        
        let userCondition = '自動'; 
        let userHealth = '普通';       
        let userApiKey = '';
        let pendingFixData = null; 
        let globalTimerInterval = null;
        let globalTimeLeftSeconds = null; 
        let isMuted = true;
        let isPaused = false;
        
        let sessionQuestionCount = 0;
        let isTimeUp = false;         
        let isOvertimeTriggered = false; 
        let isSuddenDeath = false;    
        let todayMistakes = [];       

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) document.getElementById('api-key-input').value = savedKey;
            loadDataFromSpreadsheet();
        };

        async function loadDataFromSpreadsheet() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: true, skipEmptyLines: true,
                    complete: function(results) {
                        database = results.data;
                        console.log("🎉 スプレッドシートから読み込み成功！", database.length, "問");
                        initApp(); 
                    }
                });
            } catch (error) {
                console.error("エラー:", error);
                alert("データの読み込みに失敗しました。インターネット接続を確認してください。");
                document.getElementById('chapter-select').innerHTML = '<option value="">⚠️ 読み込みエラー</option>';
            }
        }

        function initApp() {
            const selectEl = document.getElementById('chapter-select');
            if (typeof database !== 'undefined' && database.length > 0) {
                validDatabase = (Array.isArray(database) ? database.flat(Infinity) : [database]).filter(q => q && typeof q === 'object' && q.問題文 && String(q.問題文).trim() !== "");
                selectEl.innerHTML = "";
                if(validDatabase.length === 0) {
                    selectEl.innerHTML = '<option value="">データが空です</option>';
                    return;
                }
                const chapters = [...new Set(validDatabase.map(q => q.項目 || "分類なし"))];
                chapters.forEach(c => { selectEl.appendChild(new Option(c, c)); });
                selectEl.appendChild(new Option("🔥 全項目ミックス（ランダム）", "ALL"));
            }
        }

        function toggleCustomTime() {
            const selectVal = document.getElementById('time-limit-select').value;
            const customInput = document.getElementById('custom-time-input');
            if (selectVal === 'custom') customInput.classList.remove('hidden');
            else customInput.classList.add('hidden');
        }

        function toggleSound() {
            isMuted = !isMuted;
            const btn = document.getElementById('sound-toggle-btn');
            if (isMuted) {
                btn.innerHTML = "🔇 音声オフ";
                btn.className = "bg-slate-700 hover:bg-slate-600 text-white text-xs md:text-sm font-bold px-3 py-1 rounded border border-slate-500 transition-colors";
                window.speechSynthesis.cancel(); 
            } else {
                btn.innerHTML = "🔊 音声オン";
                btn.className = "bg-green-600 hover:bg-green-500 text-white text-xs md:text-sm font-bold px-3 py-1 rounded border border-green-500 transition-colors";
            }
        }

        function speakText(text) {
            if (isMuted) return; 
            const cleanText = text.replace(/<[^>]+>/g, '').replace(/[\*\_]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP';
            const currentMode = getEffectiveCondition();
            if (currentMode === 'Sっ気') { utterance.pitch = 1.3; utterance.rate = 1.3; }
            else if (currentMode === '熱血') { utterance.pitch = 1.2; utterance.rate = 1.2; } 
            else { utterance.pitch = 1.0; utterance.rate = 1.0; }
            window.speechSynthesis.cancel(); 
            window.speechSynthesis.speak(utterance);
        }

        function getEffectiveCondition() {
            if (userCondition === 'ルーレット') {
                const modes = ['普通', 'Sっ気', '熱血'];
                return modes[Math.floor(Math.random() * modes.length)];
            }
            if (userCondition !== '自動') return userCondition; 
            
            const hour = new Date().getHours();
            if (userHealth === '眠い') return 'Sっ気'; 
            if (userHealth === '病気') return '普通';   
            if (userHealth === '疲れ気味') return 'Sっ気'; 
            if (userHealth === '元気') return '熱血';   
            if (hour >= 22 || hour <= 4) return 'Sっ気'; 
            return '普通';
        }

        // 離席（一時停止）機能
        function pauseTimer() {
            // 解説画面が出ている時は一時停止不要
            if (!document.getElementById('explanation-area').classList.contains('hidden')) return;
            
            isPaused = true;
            clearInterval(timerInterval);
            clearInterval(globalTimerInterval);
            clearTimeout(idleTimeout);
            
            const timerBar = document.getElementById('timer-bar');
            if(timerBar) timerBar.style.animationPlayState = 'paused';
            
            document.getElementById('pause-overlay').classList.remove('hidden');
            document.getElementById('pause-overlay').classList.add('flex');
        }

        // 再開機能
        function resumeTimer() {
            isPaused = false;
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('pause-overlay').classList.remove('flex');
            
            const timerBar = document.getElementById('timer-bar');
            if(timerBar) timerBar.style.animationPlayState = 'running';

            // 問題用タイマー再開
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').textContent = `⏳ ${timeLeft}秒`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);

            // 全体タイマー再開
            if (globalTimeLeftSeconds !== null && !isTimeUp) {
                globalTimerInterval = setInterval(() => {
                    globalTimeLeftSeconds--;
                    if (globalTimeLeftSeconds > 0) {
                        updateGlobalTimer();
                    } else {
                        isTimeUp = true;
                        clearInterval(globalTimerInterval);
                        document.getElementById('global-timer-display').textContent = '🏁 目標時間到達 (セット完了待ち)';
                        document.getElementById('global-timer-display').className = "text-xs font-bold bg-red-600 px-3 py-1 rounded-full border border-red-800 animate-pulse";
                    }
                }, 1000);
            }
        }

        // 中断機能
        function stopTraining() {
            if(confirm("特訓を中断してスタート画面に戻りますか？")) {
                location.reload();
            }
        }

        async function generateAiMessage(situation, extraData = {}) {
            const aiMessageEl = document.getElementById('ai-message');
            document.getElementById('ai-fix-action').classList.add('hidden');
            aiMessageEl.innerHTML = '<span class="typing">💬 考えてるよ...</span>';
            
            const effectiveCond = getEffectiveCondition();
            
            let prompt = `あなたは社労士試験をサポートするAIコーチです。以下の状況と性格設定を【複合的に判断】して、1〜3文の短い話し言葉でコメントしてください。（※「AIとして〜」等の機械的な前置きは絶対禁止。定型文は使わずその都度考えて発言すること）\n\n`;
            
            if (effectiveCond === 'Sっ気') {
                prompt += `【基本性格】タメ口でフランク、小生意気な若い後輩コーチ。上から目線で煽るが、絶対に嫌な気持ちにさせない憎めないキャラ。\n`;
            } else if (effectiveCond === '熱血') {
                prompt += `【基本性格】明るくて前向きな、体育会系の姉御肌（女性）コーチ。結果よりプロセスを肯定し、「〜だろ」「〜よ！」「〜しな！」という言葉遣いで引っ張る。\n`;
            } else {
                prompt += `【基本性格】丁寧で前向きな女性コーチとして振る舞ってください。\n`;
            }

            if (situation === "start") prompt += `【状況】今から学習を開始します。気合を入れて！`;
            else if (situation === "next") prompt += `【状況】次の問題へ進みました。短く言葉をかけてください。`;
            else if (situation === "hint") prompt += `【状況】ユーザーがヒントを求めています。答えは言わず、1文で注目ポイントを示唆して！\n問題: ${extraData.questionText}\n解説: ${extraData.explanation}`;
            else if (situation === "answer") {
                prompt += `【状況】ユーザーが解答しました。結果: ${extraData.isCorrect ? "正解！" : "不正解..."}\n問題: ${extraData.questionText.substring(0,30)}...`;
            }
            else if (situation === "roulette_s_10") prompt += `【状況】ユーザーの目標時間が終了しましたが、ルーレットで【10問追加】が決定しました。時間が過ぎたことなど全く気にせず、ユーザーが休もうとしていることを見透かして、冷たく突き放すように追加の課題（10問）を命じてください。`;
            else if (situation === "roulette_s_end") prompt += `【状況】ユーザーの目標時間が終了し、ルーレットで【今日はおしまい】が決定しました。呆れや溜息を交えつつ、ほんの少しだけ労い（言葉はキツめ）、「今日は特別に見逃してあげるからさっさと寝なさい」というスタンスで終了を告げてください。`;
            else if (situation === "roulette_s_20") prompt += `【状況】ユーザーの目標時間が終了しましたが、ルーレットで【20問追加（無限サドンデス）】が決定しました。嗜虐心が最高潮の状態で、絶望する顔を楽しむように「あなたのためを思って特別に用意した地獄」として20問の追加（1ミスで即終了）をプレゼントしてください。`;
            else if (situation === "roulette_n_random") prompt += `【状況】ユーザーの目標時間が終了しましたが、ルーレットで【ランダム10問追加】が決定しました。テンション高く限界を超えようとするユーザーを熱く引っ張り、「時計なんて気にするな、ここからが本当の勝負だ！」というスポ根のノリで10問追加を告げてください。`;
            else if (situation === "roulette_n_mistake") prompt += `【状況】目標時間終了後、ルーレットで【今日間違えた問題10問】が決定しました。厳しさと愛情が混ざったコーチ目線で、「今日のミスを明日に持ち越させないための愛のムチ」として気合を入れ直させてください。`;
            else if (situation === "roulette_n_weak") prompt += `【状況】目標時間終了後、ルーレットで【過去の正解率が低い問題10問】が決定しました。ユーザーの弱点を本気で克服させようとする真剣な態度で、「壁をぶち破れ、アタシがついている」と力強く背中を押してください。`;
            else if (situation === "roulette_n_end") prompt += `【状況】目標時間終了後、ルーレットで【今日はおしまい】が決定しました。厳しい特訓を乗り越えたことを心から褒め称え、オンオフの切り替えを大事にしてしっかり休むよう温かく命令してください。`;
            else if (situation === "give_up_s") prompt += `【状況】サドンデス延長戦の途中で、ユーザーが「もう勘弁して」とギブアップしました。呆れ果てた冷たい態度をとりつつも、無理をして壊れられると困るため渋々許可してください。「情けないですね」と毒を吐きつつ、裏に微かな優しさ（明日のために休ませる）を滲ませてください。`;
            else if (situation === "give_up_n") prompt += `【状況】延長戦の途中で、ユーザーが「もう勘弁して」とギブアップしました。決して怒らず、自分の限界を自己申告できた勇気と自己管理能力を褒め、限界まで食らいついた労いと「また明日アタシについてきな！」という明るい激励で締めてください。`;

            callGeminiAPI('gemini-1.5-flash', prompt, (text) => {
                aiMessageEl.innerHTML = text;
                speakText(text); 
            });
        }

        async function verifyDataWithPro(q) {
            if (q._verified) return; 
            const prompt = `あなたはデータ検証プロです。以下の過去問データに矛盾がないか検証して。\n問題文: ${q.問題文}\nデータ正誤: ${q.正誤}\n解説: ${q.解説}\n問題なければ「OK」、矛盾があれば「NG | 〇か✖ | 理由」の形式で回答。`;
            callGeminiAPI('gemini-1.5-pro', prompt, (text) => {
                q._verified = true; 
                if (text.startsWith("NG")) {
                    const parts = text.split("|");
                    pendingFixData = { question: q, correctChoice: (parts[1] || "").trim() };
                    document.getElementById('ai-message').innerHTML = `⚠️ <b>Pro検証アラート！</b><br>${(parts[2] || "").trim()}<br>正誤を<b>【${pendingFixData.correctChoice}】</b>に修正しますか？`;
                    document.getElementById('ai-fix-action').innerHTML = `
                        <div class="flex gap-2"><button onclick="applyFix()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-3 py-1 rounded text-xs">✅ 修正する</button><button onclick="ignoreFix()" class="bg-slate-400 hover:bg-slate-500 text-white font-bold px-3 py-1 rounded text-xs">❌ そのまま</button></div>
                    `;
                    document.getElementById('ai-fix-action').classList.remove('hidden');
                }
            });
        }

        function applyFix() {
            if (pendingFixData) {
                pendingFixData.question.正誤 = pendingFixData.correctChoice;
                document.getElementById('ai-fix-action').classList.add('hidden');
                document.getElementById('ai-message').innerHTML = "修正を適用したよ！";
            }
        }

        function ignoreFix() {
            document.getElementById('ai-fix-action').classList.add('hidden');
            document.getElementById('ai-message').innerHTML = "了解！元のデータのままで進めるね。";
        }

        function askProDeeply() {
            const q = currentQuestions[currentIndex];
            document.getElementById('ai-message').innerHTML = '<span class="typing">🔥 Pro先生が深い背景を整理中...</span>';
            const prompt = `あなたは最高峰講師です。以下の問題の背景や立法趣旨を深く分かりやすく解説して。\n条文: ${q.根拠条文}\n問題文: ${q.問題文}\n解説: ${q.解説}`;
            callGeminiAPI('gemini-1.5-pro', prompt, (text) => { document.getElementById('ai-message').innerHTML = `🎓 <b>Pro講義</b><br>${text}`; });
        }

        async function callGeminiAPI(model, prompt, callback) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${userApiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                callback(data.candidates[0].content.parts[0].text);
            } catch (err) { console.error(err); }
        }

        function startTraining() {
            userApiKey = document.getElementById('api-key-input').value.trim();
            if (!userApiKey) { alert("APIキーを入力してください！"); return; }
            localStorage.setItem('gemini_api_key', userApiKey);

            if(validDatabase.length === 0) { alert("問題データがありません。スプレッドシートの読み込みをお待ちください。"); return; }

            userCondition = document.getElementById('condition-select').value;
            document.getElementById('in-game-condition').value = userCondition;
            userHealth = document.getElementById('health-select').value;
            
            sessionQuestionCount = 0;
            isTimeUp = false;
            isOvertimeTriggered = false;
            isSuddenDeath = false;
            todayMistakes = [];
            document.getElementById('give-up-btn').classList.add('hidden');

            const timeLimitVal = document.getElementById('time-limit-select').value;
            if (timeLimitVal === '無制限') {
                globalTimeLeftSeconds = null;
            } else if (timeLimitVal === 'custom') {
                const customTimeStr = document.getElementById('custom-time-input').value;
                if (!customTimeStr) { alert("終了時刻を入力してください！"); return; }
                const [hours, minutes] = customTimeStr.split(':');
                const now = new Date();
                const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(hours), parseInt(minutes), 0);
                if (target <= now) target.setDate(target.getDate() + 1);
                globalTimeLeftSeconds = Math.floor((target - now) / 1000);
            } else if (timeLimitVal === '1分') {
                globalTimeLeftSeconds = 60; 
            } else {
                globalTimeLeftSeconds = parseInt(timeLimitVal.replace('分','')) * 60;
            }

            if (globalTimeLeftSeconds !== null) {
                document.getElementById('global-timer-display').classList.remove('hidden');
                updateGlobalTimer();
                globalTimerInterval = setInterval(() => {
                    globalTimeLeftSeconds--;
                    if (globalTimeLeftSeconds > 0) {
                        updateGlobalTimer();
                    } else {
                        isTimeUp = true;
                        clearInterval(globalTimerInterval);
                        document.getElementById('global-timer-display').textContent = '🏁 目標時間到達 (セット完了待ち)';
                        document.getElementById('global-timer-display').className = "text-xs font-bold bg-red-600 px-3 py-1 rounded-full border border-red-800 animate-pulse";
                    }
                }, 1000);
            }

            const selectedChapter = document.getElementById('chapter-select').value;
            currentQuestions = selectedChapter === "ALL" ? [...validDatabase] : validDatabase.filter(q => (q.項目 || "分類なし") === selectedChapter);
            currentQuestions.sort(() => Math.random() - 0.5);

            document.getElementById('start-screen').classList.add('hidden');
            currentIndex = 0;
            loadQuestion(true); 
        }

        function updateGlobalTimer() {
            const h = Math.floor(globalTimeLeftSeconds / 3600);
            const m = Math.floor((globalTimeLeftSeconds % 3600) / 60);
            const s = globalTimeLeftSeconds % 60;
            if(h > 0) document.getElementById('global-timer-display').textContent = `🏁 残り ${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            else document.getElementById('global-timer-display').textContent = `🏁 残り ${m}:${s.toString().padStart(2, '0')}`;
        }

        function loadQuestion(isStart = false) {
            const q = currentQuestions[currentIndex];
            if (!q) return;

            document.getElementById('question-progress').textContent = `${currentIndex + 1} / ${currentQuestions.length} 問`;
            document.getElementById('question-text').textContent = q.問題文;
            document.getElementById('explanation-area').classList.add('hidden');
            
            if (isStart) generateAiMessage("start");
            else if (!isOvertimeTriggered) generateAiMessage("next"); 
            
            verifyDataWithPro(q);

            clearInterval(timerInterval);
            clearTimeout(idleTimeout);

            let questionTimeLimit = 60;
            timeLeft = questionTimeLimit;
            document.getElementById('time-display').textContent = `⏳ ${timeLeft}秒`;
            
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.animation = 'none';
            void timerBar.offsetWidth; 
            timerBar.style.animation = `timer-run ${questionTimeLimit}s linear forwards`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').textContent = `⏳ ${timeLeft}秒`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        function showHint() {
            const q = currentQuestions[currentIndex];
            generateAiMessage("hint", { questionText: q.問題文, explanation: q.解説 || "" });
        }

        function answer(userAnswer) {
            const q = currentQuestions[currentIndex];
            clearInterval(timerInterval);
            document.getElementById('timer-bar').style.animationPlayState = 'paused';

            const correctStr = (q.正誤 || "").trim();
            const isCorrect = (userAnswer === '〇' && (correctStr === '〇' || correctStr === '○')) || 
                              (userAnswer === '✖' && (correctStr === '✖' || correctStr === '×'));

            if (!isCorrect) todayMistakes.push(q);

            if (isSuddenDeath && !isCorrect) {
                alert("💀 痛恨のミス！サドンデスモードにより強制終了します。");
                location.reload();
                return;
            }

            document.getElementById('explanation-area').classList.remove('hidden');
            document.getElementById('explanation-area').classList.add('flex');

            const badge = document.getElementById('result-badge');
            if (isCorrect) {
                badge.textContent = "大正解！ 🎉";
                badge.className = "inline-block px-6 py-2 rounded-full text-xl font-bold text-white bg-green-500 animate-bounce";
            } else {
                badge.textContent = "不正解... 💦";
                badge.className = "inline-block px-6 py-2 rounded-full text-xl font-bold text-white bg-red-500";
            }

            document.getElementById('article-text').textContent = q.根拠条文 || '条文なし';
            document.getElementById('explanation-text').innerHTML = q.解説 || '解説なし';

            generateAiMessage("answer", { isCorrect: isCorrect, questionText: q.問題文 });
        }

        function nextQuestion() {
            sessionQuestionCount++;
            currentIndex++;
            
            if (sessionQuestionCount % 10 === 0 && isTimeUp && !isOvertimeTriggered) {
                handleOvertimeRoulette();
                return;
            }

            if (currentIndex >= currentQuestions.length) {
                alert("用意された問題をすべて解き終わりました！素晴らしい！");
                location.reload();
            } else {
                loadQuestion();
            }
        }

        function handleOvertimeRoulette() {
            isOvertimeTriggered = true; 
            const roll = Math.floor(Math.random() * 10) + 1; 
            const cond = getEffectiveCondition();

            document.getElementById('ai-message-box').className = "bg-red-100 rounded-2xl p-4 shadow-sm border border-red-300 relative";
            document.getElementById('give-up-btn').classList.remove('hidden'); 

            if (cond === 'Sっ気') {
                if (roll <= 6) { 
                    generateAiMessage("roulette_s_10");
                    appendRandomQuestions(10);
                } else if (roll <= 9) { 
                    generateAiMessage("roulette_s_end");
                    setTimeout(() => { alert("今日はここまで。お疲れ様でした。"); location.reload(); }, 5000);
                } else { 
                    isSuddenDeath = true;
                    generateAiMessage("roulette_s_20");
                    appendRandomQuestions(20);
                }
            } else if (cond === '熱血') {
                if (roll <= 3) { 
                    generateAiMessage("roulette_n_random");
                    appendRandomQuestions(10);
                } else if (roll <= 6) { 
                    generateAiMessage("roulette_n_mistake");
                    appendQuestionsFromList(todayMistakes, 10);
                } else if (roll <= 9) { 
                    generateAiMessage("roulette_n_weak");
                    appendRandomQuestions(10);
                } else { 
                    generateAiMessage("roulette_n_end");
                    setTimeout(() => { alert("今日の特訓は終了！よく頑張ったな！"); location.reload(); }, 5000);
                }
            } else {
                alert("目標時間が終了しました。今日の学習はここまでです！お疲れ様でした！");
                location.reload();
            }
        }

        function appendRandomQuestions(count) {
            let extra = validDatabase.sort(() => Math.random() - 0.5).slice(0, count);
            currentQuestions = currentQuestions.concat(extra);
            loadQuestion();
        }

        function appendQuestionsFromList(list, count) {
            if (list.length === 0) {
                appendRandomQuestions(count); 
                return;
            }
            let extra = list.sort(() => Math.random() - 0.5).slice(0, count);
            currentQuestions = currentQuestions.concat(extra);
            loadQuestion();
        }

        function giveUp() {
            const cond = getEffectiveCondition();
            if (cond === 'Sっ気') {
                generateAiMessage("give_up_s");
            } else {
                generateAiMessage("give_up_n");
            }
            setTimeout(() => {
                alert("学習を終了します。ゆっくり休んでください！");
                location.reload();
            }, 5000);
        }

    </script>
